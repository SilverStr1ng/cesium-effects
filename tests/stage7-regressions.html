<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Stage 7 browser regressions</title>
<style>body{font:14px system-ui;background:#101923;color:#e7eef7}iframe{width:1000px;height:650px;border:1px solid #456}pre{white-space:pre-wrap}</style>
<h1>Stage 7 — independent browser checks</h1><p>Sequential real WebGL pages; these are not GPU performance rounds.</p>
<button id="run">Run regressions</button><b id="status">READY</b><iframe id="probe"></iframe><pre id="result"></pre>
<script type="module">
const frame=document.querySelector('#probe'),out=document.querySelector('#result'),status=document.querySelector('#status'),button=document.querySelector('#run');
const names=['cloud-shadow-support','cloud-partial','cloud-finite','cloud-layered-closure','cloud-closure','cloud-grazing','cloud-startup','cloud-pipeline','atmosphere-gpu','lighting-gpu','cloud-gpu','water-cloud-gpu','high-cloud-gpu','celestial-state','celestial-scene','celestial-gpu','celestial-optics','satellite-lod','cloud-cache','actual-entry?auto'];
button.onclick=async()=>{button.disabled=true;const results=[];for(const name of names){status.textContent=name;const start=performance.now();frame.src=name.includes('?')?name.replace('?','.html?'):name+'.html';const value=await new Promise(resolve=>{let loaded=false;frame.onload=()=>loaded=true;const timer=setInterval(()=>{if(!loaded)return;const doc=frame.contentDocument,text=doc?.querySelector('#result,#entry-result')?.textContent??'';try{const data=JSON.parse(text);if(typeof data.passed==='boolean'){clearInterval(timer);resolve(data);return;}}catch{}if(doc?.title.startsWith('ERROR')||performance.now()-start>900000){clearInterval(timer);resolve({passed:false,error:text||doc?.body.textContent,timeout:performance.now()-start>900000});}},500);});results.push({name,wallMs:performance.now()-start,...value});out.textContent=JSON.stringify({complete:false,results},null,2);}frame.src='about:blank';status.textContent='COMPLETE';out.textContent=JSON.stringify({complete:true,passed:results.every(r=>r.passed),results},null,2);button.disabled=false;};
</script></html>
